<title>EQ OS by Drishta Vidya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a presenter's console beside a phone-width app; the console explains each adaptation while the app runs. */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface-2:#F4F5F9; --sunk:#E6E9F1;
  --ink:#151925; --muted:#5A6175; --faint:#8A90A2; --line:#DCE0EA;
  --accent:#C8661A; --accent-ink:#FFFFFF; --accent-soft:#FCEBDB;
  --ok:#2F7D5B; --warn:#B7791F; --crit:#B83A2E; --crit-soft:#FBE7E4;
  --f-anger:#C2412F; --f-fear:#6B4FB8; --f-overwhelm:#B7791F; --f-sadness:#2F62B5; --f-lonely:#4F6F8F;
  --f-shame:#9B3F7A; --f-guilt:#8A5A3B; --f-envy:#3C8A4A; --f-contempt:#6F7A2E; --f-surprise:#1F8A8A; --f-joy:#D08A12;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, "Noto Sans Tamil", "Noto Sans Devanagari", sans-serif;
  --shadow:0 1px 2px rgba(20,25,40,.06), 0 8px 24px rgba(20,25,40,.08);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1018; --surface:#161A25; --surface-2:#1C2130; --sunk:#232939; --ink:#ECEEF5; --muted:#A1A8BB; --faint:#7A8196; --line:#2A3043;
    --accent:#F0913E; --accent-ink:#1A1206; --accent-soft:#3A2817; --ok:#5DBA8E; --warn:#E3A84A; --crit:#EE7466; --crit-soft:#3B1F1C;
    --f-anger:#EE7466; --f-fear:#A38CF0; --f-overwhelm:#E3A84A; --f-sadness:#6E9CEB; --f-lonely:#8EA9C6;
    --f-shame:#D77FB6; --f-guilt:#C99673; --f-envy:#6CC27C; --f-contempt:#B4C064; --f-surprise:#4FC6C6; --f-joy:#F2BE4C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1018; --surface:#161A25; --surface-2:#1C2130; --sunk:#232939; --ink:#ECEEF5; --muted:#A1A8BB; --faint:#7A8196; --line:#2A3043;
  --accent:#F0913E; --accent-ink:#1A1206; --accent-soft:#3A2817; --ok:#5DBA8E; --warn:#E3A84A; --crit:#EE7466; --crit-soft:#3B1F1C;
  --f-anger:#EE7466; --f-fear:#A38CF0; --f-overwhelm:#E3A84A; --f-sadness:#6E9CEB; --f-lonely:#8EA9C6;
  --f-shame:#D77FB6; --f-guilt:#C99673; --f-envy:#6CC27C; --f-contempt:#B4C064; --f-surprise:#4FC6C6; --f-joy:#F2BE4C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* Shell */
.wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.frame{position:relative;display:flex;flex-direction:column;height:100%;background:var(--surface);overflow:hidden;min-width:0}
.rail{display:none}
@media (min-width:920px){
  .wrap{grid-template-columns:340px 420px;justify-content:center;gap:40px;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .rail{display:flex;flex-direction:column;gap:20px;height:100%;overflow-y:auto;min-width:0;padding-right:4px}
  .frame{height:min(880px,100%);border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow)}
  .appbar .demo-btn{display:none !important}
  .wrap.collapsed{grid-template-columns:420px}
  .wrap.collapsed .rail{display:none}
  .wrap.collapsed .appbar .demo-btn{display:inline-flex !important}
}
@media (max-width:919.98px){
  .rail.open{display:flex;flex-direction:column;gap:20px;position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
    padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Rail */
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.brand b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:15px}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:8px}
.person:hover{background:var(--surface-2)}
.person.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--ink)}
.person b{display:block;font-size:14px}
.person span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.person .avatar{display:grid;place-items:center;font-size:13px;color:var(--ink)}
.signals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sig{background:var(--surface-2);border-radius:12px;padding:10px;min-width:0}
.sig .eyebrow{font-size:10.5px}
.sig p{font-size:12.5px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}
.log{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
.log-item{border-left:2px solid var(--line);padding-left:10px}
.log-item.new{border-left-color:var(--accent)}
.log-item b{font-size:13px;display:block}
.log-item time{font-size:11px;color:var(--faint)}
.log-item ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}
.ai-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.live{background:var(--ok)}

/* App bar + nav */
.appbar{flex:none;display:flex;align-items:center;gap:8px;min-height:56px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.appbar h2{font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.demo-btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:16px;padding-bottom:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:700}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.pub{background:var(--accent-soft);color:var(--accent)}
.why{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.why .tag{font-weight:500}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title h3{font-size:16px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13.5px}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.note{font-size:12.5px;color:var(--muted)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:15px}
textarea{min-height:96px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}

/* Home */
.hello h1{font-size:28px;line-height:1.15}
.hello .local{font-size:13px;color:var(--muted)}
.ask{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:14px 14px;color:var(--muted);font-size:15px}
.ask svg{width:20px;height:20px;flex:none;color:var(--accent)}
.sos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sos button{border:0;border-radius:12px;padding:10px 4px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--fc) 14%,var(--surface));color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.sos button i{width:10px;height:10px;border-radius:50%;background:var(--fc)}
.moment h3{font-size:19px}
.engine-label{font-size:12px;color:var(--muted);font-weight:600}

/* Feel */
.fam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fam{text-align:left;border:0;border-radius:14px;padding:12px;background:color-mix(in srgb,var(--fc) 13%,var(--surface));display:flex;flex-direction:column;gap:4px;min-height:84px;position:relative;overflow:hidden}
.fam::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fc)}
.fam b{font-family:var(--display);font-size:16px}
.fam span{font-size:12px;color:var(--muted);line-height:1.35}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.rung .lvl{display:flex;gap:2px;flex:none}
.rung .lvl i{width:5px;height:14px;border-radius:2px;background:var(--sunk)}
.rung .lvl i.f{background:var(--fc)}
.rung b{display:block;font-size:15px;text-transform:capitalize}
.rung span{display:block;font-size:12.5px;color:var(--muted)}
.emo-head{border-radius:16px;padding:16px;background:color-mix(in srgb,var(--fc) 14%,var(--surface));display:flex;flex-direction:column;gap:6px}
.emo-head h1{font-size:30px;text-transform:capitalize}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.big-num{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.band{font-size:13px;font-weight:600}
.strategy{display:grid;gap:8px}
.strategy div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13.5px}
.strategy dt,.strategy b{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.never{border-top:1px dashed var(--line);padding-top:8px}

/* Tools */
.engine{display:flex;flex-direction:column;gap:8px}
.engine-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.engine-head h3{font-size:15px}
.tool{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px}
.tool .gly{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent)}
.tool .gly svg{width:18px;height:18px}
.tool b{display:block;font-size:14.5px}
.tool span{display:block;font-size:12.5px;color:var(--muted)}
.tool .meta{margin-left:auto;font-size:12px;color:var(--faint);flex:none}

/* Player */
.player{display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px}
.orb-wrap{width:220px;height:220px;max-width:100%;display:grid;place-items:center;position:relative}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--line)}
.orb{width:220px;height:220px;max-width:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--accent) 55%,var(--surface)), var(--accent));transform:scale(.55);transition-property:transform;transition-timing-function:ease-in-out;opacity:.9}
.orb.in{transform:scale(1)}
.orb.out{transform:scale(.55)}
.phase{font-family:var(--display);font-size:24px;font-weight:600;text-align:center;min-height:36px}
.say{font-size:15px;text-align:center;color:var(--muted);max-width:30ch;min-height:44px}
@media (prefers-reduced-motion:reduce){.orb{transition:none !important}}

/* Steps / script */
.stepper{display:flex;gap:4px}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--sunk)}
.stepper i.d{background:var(--accent)}
.prompt{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.25}
.script-step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.script-step .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.script-step b{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.script-step p{font-size:15px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--surface);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.them{align-self:flex-start;background:color-mix(in srgb,var(--f-fear) 12%,var(--surface));border-bottom-left-radius:6px}
.msg .who{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;height:46px;flex:1}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}

/* Crisis */
.crisis{border:1.5px solid var(--crit);background:var(--crit-soft)}
.crisis h3{color:var(--crit)}
.number{font-family:var(--display);font-size:26px;font-weight:700;user-select:all}

/* Grow */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px}
.chain span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-weight:600}
.chain em{font-style:normal;color:var(--faint)}
.module{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.module .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px}
.module .st.done{background:var(--ok);border-color:var(--ok)}
.module .st.now{border-color:var(--accent);background:var(--accent-soft)}
.module b{font-size:14.5px;display:block}
.module span{font-size:12.5px;color:var(--muted)}
.spark{width:100%;height:84px;display:block}
.cap{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.cap .track{position:relative;height:8px;background:var(--sunk);border-radius:999px}
.cap .track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.cap .track i.b{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.cap .track i.n{background:var(--accent);height:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Me */
.prof{display:flex;flex-direction:column}
.prof-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prof-row:last-child{border-bottom:0}
.prof-row b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.prof-row span{display:block;font-size:14px}
.prof-row.off span{color:var(--faint);text-decoration:line-through}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--sunk);transition:background .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.req{font-size:11.5px;color:var(--faint);font-weight:600}

/* Onboarding */
.ob{display:flex;flex-direction:column;gap:18px}
.ob h1{font-size:28px;line-height:1.15}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:14.5px}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.drishti{--s:30px;width:var(--s);height:var(--s);border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--accent) 40%,var(--surface)), var(--accent));animation:breathe 6s ease-in-out infinite}
.drishti.lg{--s:76px}
.drishti.busy{animation-duration:1.4s}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.82}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.drishti{animation:none}}
.d-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-block:4px 6px}
.d-head b{font-family:var(--display);font-size:22px}
.ask-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:-8px}
.clip{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px}
.poster{aspect-ratio:9/16;width:100%;max-width:100%;border-radius:10px;border:1.5px dashed var(--faint);background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--sunk) 8px 16px);display:grid;place-items:center;position:relative}
.poster .play{width:34px;height:34px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.poster .play svg{width:16px;height:16px}
.poster .dur{position:absolute;bottom:6px;right:6px;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 5px}
.clip b{display:block;font-size:14px;line-height:1.3}
.clip .m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.clips-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.clips-row .clip{grid-template-columns:1fr;width:140px;flex:none;align-items:start}
.big-poster{width:min(220px,64%);margin-inline:auto}
.big-poster .play{width:52px;height:52px}
.weather{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wcell{aspect-ratio:1;border-radius:9px;background:color-mix(in srgb,var(--fc) 62%,var(--surface));display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink)}
.wcell.empty{background:var(--sunk);color:var(--faint)}
.wcell.today{outline:2px solid var(--ink);outline-offset:1px}
.wlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.wlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:color-mix(in srgb,var(--fc) 62%,var(--surface))}
.noticed p{font-size:13.5px;padding-left:14px;position:relative}
.noticed p::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.share-card{border-radius:16px;padding:16px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:8px}
.share-card .eyebrow{color:color-mix(in srgb,var(--surface) 70%,var(--ink))}
.share-card p.big{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.3}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock{border-radius:18px;padding:12px;background:var(--ink);color:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.lock-time{font-family:var(--display);font-size:28px;font-weight:600;line-height:1}
.lock-row{display:flex;gap:10px}
.comp{border:0;background:color-mix(in srgb,var(--surface) 14%,var(--ink));color:var(--surface);border-radius:999px;width:52px;height:52px;display:grid;place-items:center;padding:0}
.comp svg{width:20px;height:20px}
.comp-l{font-size:10.5px;opacity:.75;text-align:center;width:52px}
.hw{border:0;border-radius:22px;padding:12px;background:var(--accent-soft);display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;aspect-ratio:1;min-width:0}
.hw b{font-family:var(--display);font-size:17px;margin-top:auto}
.hw small{font-size:11.5px;color:var(--muted);line-height:1.3}
.panic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px 16px;background:var(--ink);color:var(--surface)}
.panic b{display:block;font-family:var(--display);font-size:17px}
.panic span.s{display:block;font-size:12.5px;opacity:.75}
.calib{border:1.5px dashed var(--accent);background:var(--accent-soft)}
.maybe{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13.5px;align-items:baseline}
.maybe b{text-transform:capitalize}
.fold{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.fold h3{font-size:15px}
.fold .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fold svg{width:18px;height:18px;flex:none;transition:transform .15s;color:var(--muted)}
.panel.shut .fold svg{transform:rotate(-90deg)}
.panel.shut{gap:0}
.rail-actions{display:flex;gap:6px;flex:none}
.rail-head .brand small{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fold svg{transition:none}}
.toast{pointer-events:none;position:absolute;left:16px;right:16px;bottom:76px;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:5;box-shadow:var(--shadow)}
</style>

function getClip(id){
  if(VIDEOS[id]) return VIDEOS[id];
  const m = /^prog:(\w+):(\d+)$/.exec(id); if(!m) return null;
  const pr = PROGRAMS.find(x=>x.id===m[1]); const mod = pr && pr.mods[+m[2]]; if(!mod) return null;
  const who = ['Deepa Kannan','Anbarasu Thangavelu','Dr. Gabriel'][+m[2]%3];
  return {title:mod[0], who, secs:75, kind:'Facilitator clip', purpose:'Opens the module in the facilitator\u2019s own voice, so the program continues after the workshop.', beats:['The idea in one sentence','A real example from the workshop','What to try this week'], on:'program '+pr.name};
}
const mmss = n => Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function clipHtml(id, label){
  const v=getClip(id); if(!v) return '';
  return `<button class="clip" data-a="clip" data-id="${id}"><span class="poster" aria-hidden="true"><span class="play">${I.play}</span><span class="dur tnum">${mmss(v.secs)}</span></span><span style="min-width:0">${label?`<span class="eyebrow">${esc(label)}</span>`:''}<b>${esc(v.title)}</b><span class="m">${esc(v.kind)} \u00b7 ${esc(v.who)}</span><span class="m">Placeholder \u00b7 to be recorded</span></span></button>`;
}

/* ---------- Adaptation engine ---------- */
function resetFor(fam){

  else if(fam==='fear') id='slow-exhale';
  else if(fam==='lonely') id='connect-now';
  else if(fam==='surprise') id='grounding';
  if(id==='slow-exhale' && state.ratings['slow-exhale']==='no'){ id='box-breath'; why.push('slow-exhale did not help you last time'); }
  if(id==='shift-reset') why.push('role: '+p.role.toLowerCase());
  return {id, why};
}
function reflectFor(fam){
  const p=state.p;
  const m = {anger:'feeling-under', fear:'story-fact', overwhelm:'triage', sadness:(on('household') && /widow/i.test(p.household))?'grief-checkin':'after-moment', lonely:'connect-now', shame:'self-kind', guilt:'repair-apology', envy:'comparison-reset', contempt:'story-fact', surprise:'story-fact', joy:'savour'};

  return id;
}

  }

  if(g==='self'){ id = ci && ci.fam==='envy' ? 'comparison-reset' : reflectFor(ci?ci.fam:'anger'); why.push('goal: '+GOALS[g].toLowerCase()); if(ci) why.push(`check-in word “${ci.word}”`); if(on('band')) why.push('age '+p.band); }
  else if(g==='stress'){ id = (on('role') && p.rg==='healthcare') ? 'shift-reset' : 'box-breath'; why.push('goal: handle stress'); if(on('role') && p.rg==='healthcare') why.push('role: '+p.role.toLowerCase()); }

function spark(arr){
  const w=300,h=84,pad=8, n=arr.length;
  const x=i=>pad+i*(w-2*pad)/(n-1), y=v=>pad+(10-v)*(h-2*pad)/9;
  const pts = arr.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${h-pad} ${pts} ${x(n-1)},${h-pad}`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Intensity of difficult feelings over the last 14 check-ins">
    <line x1="${pad}" x2="${w-pad}" y1="${y(5)}" y2="${y(5)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <polygon points="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(n-1)}" cy="${y(arr[n-1])}" r="4" fill="var(--accent)"/></svg>`;
}

/* ---------- Reset player ---------- */
function buildPhases(t){
  if(t.custom) return t.custom.map(x=>({label:x[0], secs:x[1], kind:x[2], text:x[3]||''}));
  const out=[]; for(let c=0;c<t.cycles;c++) t.seq.forEach(s=>out.push({label:s[0], secs:s[1], kind:s[2], text:''}));
  return out;
}
function play(id){
  const t=T[id], phases=buildPhases(t), orb=$('#orb'), ph=$('#phase'), say=$('#say'), left=$('#left'), btn=$('#playbtn');
  if(!orb) return;
  if(btn.dataset.running==='1'){ clearTimers(); btn.dataset.running='0'; btn.textContent='Start again'; ph.textContent='Paused'; orb.className='orb'; return; }
  clearTimers(); btn.dataset.running='1'; btn.textContent='Stop';
  let total = phases.reduce((a,p)=>a+p.secs,0), i=0;
  const tick = ()=>{ left.textContent = total>0 ? `${Math.floor(total/60)}:${String(total%60).padStart(2,'0')} left` : ''; };
  const runPhase = ()=>{
    if(i>=phases.length){ btn.dataset.running='0'; btn.textContent='Start again'; ph.textContent='Done'; say.textContent='Notice how your body feels now.'; orb.className='orb'; left.textContent=''; if(id==='panic'){ ph.textContent='Feeling a bit steadier?'; say.textContent='Want to name what just happened, so we can plan your next move?'; }
      $('#rate-slot').innerHTML=(id==='panic'?'<div class="row"><button class="btn primary" data-a="tab" data-v="feel">Name what happened</button><button class="btn ghost" data-a="tab" data-v="home">Not now</button></div>':'')+rateBlock(id); bind(); logEvent('Completed: '+toolName(id), id==='panic'?['naming offered only after the reset']:['follow-up check-in scheduled in 3 hours']); renderRail(); return; }
    const p=phases[i]; ph.textContent=p.label; say.textContent=p.text || (p.kind==='hold'?'Stay still and soft.':'');
    orb.style.transitionDuration = p.secs+'s';
    if(p.kind==='in') orb.className='orb in'; else if(p.kind==='out') orb.className='orb out';
    let s=p.secs; const step=()=>{ tick(); total--; s--; if(s>0) timers.push(setTimeout(step,1000)); else { i++; runPhase(); } }; step();
  };
  orb.className='orb out'; timers.push(setTimeout(runPhase, 60));
}

const CRISIS_RE = /(suicid|kill myself|end my life|end it all|want to die|self[- ]?harm|hurt myself|cut myself|no reason to live|better off dead|hits me|beats me|abus(e|ing) me|me matar|suic[ií]dio|quero morrer|தற்கொலை|आत्महत्या)/i;

function toolList(){ return Object.entries(T).filter(([k,t])=>!t.preview && t.e!=='checkin').map(([k,t])=>`${k}: ${t.name}`).join('\n'); }
function companionRules(){
  const h = HELP[state.p.country] || HELP._;

How to reply:

- When one tool would clearly help, put on its own final line exactly [[tool:ID]] using one ID from this list (at most one):
${toolList()}
- If they mention self-harm, suicide, abuse, or someone in danger: do not coach. Respond with care, urge them to contact ${h.name} (${h.num}) or local emergency services now, and end with [[crisis]].

function fallbackReply(text){
  const s=text.toLowerCase(); const pt = state.p.lang==='pt';

    [/ahead|behind|batch|compar/, 'envy', 'Comparison can sting.', 'Would you call it envy, feeling behind, or pressure?'],
    [/snap|shout|yell/, 'guilt', 'It takes honesty to notice that.', 'Is it guilt, exhaustion, or both?'],
    [/cried|crying|upset|nurse/, 'sadness', 'That is a lot to hold for someone else.', 'Are you feeling worried, moved, or stretched yourself?'],
    [/switch off|sleep|night/, 'overwhelm', 'Your mind is still on shift.', 'Does it feel like overwhelm, worry, or restlessness?'],
    [/silenc|sozinho|longe|dias|lonely|alone/, 'lonely', pt?'Sinto muito. A casa silenciosa pesa.':'I’m sorry. A quiet house can feel heavy.', pt?'Seria saudade, solidão ou tristeza?':'Would you call it longing, loneliness, or sadness?'],
    [/deadline|cousin|late|let someone go|fire/, 'anger', 'That puts you between family and the business.', 'Is it frustration, worry about the business, or dread about the conversation?'],
    [/marriage|amma|parents|mother/, 'fear', 'Family expectations can weigh a lot.', 'Is it pressure, guilt, or irritation?']];

async function sendChat(text){
  text = String(text||'').trim(); if(!text) return;
  state.chat.push({role:'user', content:text});
  if(CRISIS_RE.test(text)){
    const h = HELP[state.p.country] || HELP._;
    state.chat.push({role:'assistant', crisis:true, content:`I’m really glad you told me. This matters more than any exercise. Please reach out to ${h.name} at ${h.num}, or local emergency services if you are in danger right now. Would you like a Drishta Vidya coach to follow up with you too?`});
    logEvent('Safety check: risk words detected', ['coaching stopped','local crisis line shown: '+h.name]);
    render(); renderRail(); return;
  }
  const bubble={role:'assistant', content:'', pending:true}; state.chat.push(bubble); render();
  if(!state.ai){
    timers.push(setTimeout(()=>{ bubble.content=fallbackReply(text); bubble.pending=false; bubble.note=state.ai===null?'Sample reply. Live AI works when the viewer allows Claude.':''; logEvent('Drishti replied (sample)', ['named the feeling first','offered one tool']); render(); renderRail(); }, 700));
    return;
  }
  const turns = state.chat.filter(m=>!m.pending && m!==bubble).slice(-12).map(m=>({role:m.role, content: m.role==='assistant'? (parseTokens(m.content).clean || '…') : m.content}));
  while(turns.length && turns[0].role!=='user') turns.shift();
  try{
    const res = await state.ai([{role:'user', content:companionRules()}, ...turns], {cache:false, modelTier:'quick', onText:({text})=>{ bubble.pending=false; bubble.content=text; const el=document.querySelector(`[data-m="${state.chat.indexOf(bubble)}"] .txt`); if(el) el.innerHTML=fmt(parseTokens(text).clean); else render(); const s=$('#screen'); if(s) s.scrollTop=s.scrollHeight; }});
    bubble.content=res.text; bubble.pending=false;
    const pt=parseTokens(res.text);
    logEvent('Drishti replied (live AI)', ['used your profile and check-in', ...(pt.tools.length?['suggested: '+toolName(pt.tools[0])]:[]), ...(pt.crisis?['crisis route shown']:[])]);
  }catch(e){
    bubble.pending=false;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){ state.ai=null; bubble.content=fallbackReply(text); bubble.note='Live AI is off for this view, so this is a sample reply.'; }
    else if(e.code==='rate_limited'){ bubble.content=e.text||''; bubble.note='Too many requests just now. Try again in a minute.'; }
    else { bubble.content=e.text||fallbackReply(text); bubble.note= e.text ? 'The reply was interrupted.' : 'Live AI did not answer, so this is a sample reply.'; }
  }
  render(); renderRail();
}

    case 'share': logEvent('Shared a week card', ['no private details included']); renderRail(); toast('Shares a card with no private details, for example to WhatsApp status.'); break;
    case 'obset': { const k=el.dataset.k; state.ob[k]=el.dataset.v; if(k==='word') state.ob.fam=el.dataset.f; render(); break; }
    case 'obcancel': state.ob=null; render(); break;
    case 'obdone': finishOnboard(); break;
  }
}
function startOnboard(){ clearTimers(); state.ob={step:'feel', n:5}; logEvent('New user opened the app', ['no sign-up screen','first question: how are you?']); render(); renderRail(); scrollTop(); }
function minimalProfile(o){
  return {id:'new', name:'You', ini:'Y', blurb:'New user', band:'Not shared', country:'Other', city:'', lang:'en', langLabel:'English', channel:'App', goal:'self', partial:true,
    role:'Not shared yet', rg:null, household:'Not shared yet', children:'Not shared yet', caregiving:'Not shared yet', pattern:'Not shared yet', culture:'Not set yet', faith:'Not shared', gender:'Not shared',
    path:null, day:1, intent:null, deeper:null, ci:{word:o.word, fam:o.fam, n:o.n}, season:'', nudge:null, perf:[], ratings:{},
    chips:['Something at work upset me','I feel stretched thin','I keep comparing myself to others'], trend:[6,6,6,6,6,6,6,6,6,6,6,6,6,o.n], caps:[[40,40],[40,40],[40,40],[40,40],[40,40]],
    moments:['Your first check-in'], patterns:['Patterns appear after about two weeks of check-ins.'], share:'This week I started noticing my feelings.'};
}
function firstTap(){
  const o=state.ob;
  state.pid='new'; state.p=minimalProfile(o); state.off={}; state.ci={word:o.word, fam:o.fam, n:o.n}; state.ratings={}; state.chat=[]; state.moment=null; state.rw=null; state.calib={}; state.dc=null; state.weekPick=null; state.intentEdit=false; state.deeperOff=false;
  logEvent('First tap: '+o.word+' at '+o.n+'/10', ['nothing asked yet']);
  adapt();
  o.tool = state.moment.id; o.step='first';
  render(); renderRail(); scrollTop();
}
function finishOnboard(){
  const o=state.ob, p=state.p;
  if(o.lang){ p.lang=o.lang; p.langLabel=LANGS[o.lang]; }
  if(o.band) p.band=o.band;
  if(o.country){ p.country=o.country; p.culture='Set per situation by you, never from country'; }
  if(o.goal) p.goal=o.goal;
  p.partial=false;
  const dp=defaultPath(p); p.path=dp.path;
  const h=HELP[p.country]||HELP._;
  logEvent('Profile made yours', [o.lang?'language: '+LANGS[o.lang]:'language skipped', o.band?'age '+o.band:'age skipped', o.country||'country skipped']);
  if(o.country) logEvent('Support line set → '+h.name, ['from country: '+o.country]);
  logEvent('Suggested path → '+PATHS[dp.path].name, dp.why);
  state.ob=null; state.stack=[{v:'home'}];
  adapt();
  render(); renderRail(); scrollTop();
}

/* ---------- Rail ---------- */
const isDesk = ()=>{ try{ return window.matchMedia('(min-width:920px)').matches; }catch(e){ return true; } };
const UI = {collapsed:false, fold:{}};
try{ const saved = JSON.parse(localStorage.getItem('eqos-ui')||'null'); if(saved){ UI.collapsed=!!saved.collapsed; UI.fold=saved.fold||{}; } }catch(e){}
function saveUI(){ try{ localStorage.setItem('eqos-ui', JSON.stringify(UI)); }catch(e){} }
function setCollapsed(v){ UI.collapsed=v; saveUI(); applyCollapsed(); }
function applyCollapsed(){ const w=document.querySelector('.wrap'); if(w) w.classList.toggle('collapsed', !!UI.collapsed); }
function panel(key, title, sub, body){
  const shut = !!UI.fold[key];
  return `<div class="panel ${shut?'shut':''}"><button class="fold" data-r="fold" data-k="${key}" aria-expanded="${!shut}"><h3>${title}</h3>${sub?`<span class="sub">${sub}</span>`:''}${I.chev}</button>${shut?'':body}</div>`;
}
function renderRail(){
  const rail=$('#rail'); if(!state.p) return;
  const p=state.p, lt=localTime();
  const worked = Object.entries(state.ratings).map(([k,v])=>`${toolName(k)}: ${({yes:'helped',bit:'a bit',no:'did not help'})[v]}`);
  const who = [on('band')?p.band:null, p.country, p.langLabel, on('role')?p.role:null, 'goal: '+GOALS[p.goal]].filter(Boolean).join(' · ');
  rail.innerHTML = `
  <div class="rail-head"><div class="brand"><div class="mark">EQ</div><div><b>EQ OS</b><small>Demo · Drishta Vidya</small></div></div><div class="rail-actions"><button class="demo-btn" data-r="foldall" style="display:inline-flex;align-items:center">${Object.values(UI.fold).filter(Boolean).length>=4?'Unfold all':'Fold all'}</button><button class="demo-btn" data-r="close" style="display:inline-flex;align-items:center" aria-label="Hide the demo panel">${isDesk()?'Hide':'Close'}</button></div></div>
  ${panel('try','Try it as', esc(state.ob||state.pid==='new'?'New user':p.name), `
    <div class="people">
      ${Object.values(PEOPLE).map(x=>`<button class="person ${state.pid===x.id&&!state.ob?'on':''}" data-r="person" data-id="${x.id}"><span class="avatar">${x.ini}</span><span><b>${esc(x.name)}</b><span>${esc(x.blurb)}</span></span></button>`).join('')}
      <button class="person ${state.ob||state.pid==='new'?'on':''}" data-r="new"><span class="avatar">+</span><span><b>New user</b><span>One tap for help first; questions only if they want</span></span></button>
    </div>
    <p class="note">Illustrative people. All data in this demo is example data.</p>`)}
  ${panel('phone','On the phone','Widgets', `
    <div class="widgets">
      <div class="lock"><span class="lock-time tnum">${esc(lt.hm)}</span><div class="lock-row"><div><button class="comp" data-r="w-check" aria-label="Check in from the lock screen"><span class="drishti" style="--s:24px"></span></button><p class="comp-l">Check in</p></div><div><button class="comp" data-r="w-panic" aria-label="60-second reset from the lock screen">${I.wave}</button><p class="comp-l">Reset</p></div></div></div>
      <button class="hw" data-r="w-breathe"><span class="drishti"></span><b>Breathe</b><small>1 min</small><small>${esc(p.intent?INTENTS[p.intent][0]:'Choose an intention')}</small></button>
    </div>
    <p class="note">Lock-screen and home-screen widgets: one tap, without opening the app.</p>`)}
  ${panel('hood','Under the hood', state.ai?'Live AI':'Sample replies', `
    <div class="signals">
      <div class="sig"><p class="eyebrow">Who you are</p><p>${esc(who)}</p></div>
      <div class="sig"><p class="eyebrow">Where you are</p><p class="tnum">${esc(lt.label)}${p.season?' · '+esc(p.season):''}</p></div>
      <div class="sig"><p class="eyebrow">How you are</p><p>${state.ci?esc(state.ci.word)+' · '+state.ci.n+'/10':'No check-in yet'}</p></div>
      <div class="sig"><p class="eyebrow">What works for you</p><p>${worked.length?esc(worked.join('; ')):'Learning from your first ratings'}</p></div>
    </div>
    <div class="ai-status"><span class="dot ${state.ai?'live':''}"></span><span>${state.ai?'Drishti and rehearsal use live AI':(state.ai===undefined?'Checking for live AI…':'Live AI off in this view; sample replies shown')}</span></div>`)}
  ${panel('log','Adaptation log', 'Newest first', `
    <div class="log">${state.log.map((l,i)=>`<div class="log-item ${i<2?'new':''}"><time class="tnum">${esc(l.t)}</time><b>${esc(l.title)}</b>${l.why.length?`<ul>${l.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`)}`;
  rail.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.r;
    if(r==='close'){ if(isDesk()) setCollapsed(true); else rail.classList.remove('open'); return; }
    if(r==='fold'){ const k=b.dataset.k; UI.fold[k]=!UI.fold[k]; saveUI(); renderRail(); return; }
    if(r==='foldall'){ const all = Object.values(UI.fold).filter(Boolean).length>=4; ['try','phone','hood','log'].forEach(k=>UI.fold[k]=!all); saveUI(); renderRail(); return; }
    if(r==='person'){ rail.classList.remove('open'); loadPerson(b.dataset.id); return; }
    if(r==='new'){ rail.classList.remove('open'); startOnboard(); return; }
    if(r==='w-panic'){ rail.classList.remove('open'); state.ob=null; state.stack=[{v:'home'}]; renderRail(); openTool('panic'); return; }
    if(r==='w-check'||r==='w-breathe'){ rail.classList.remove('open'); if(state.ob){ state.ob=null; } state.stack=[{v:'home'}]; logEvent('Opened from a widget', [r==='w-check'?'lock-screen check-in':'one-tap breathing']); renderRail(); openTool(r==='w-check'?'mood-check':'slow-exhale'); return; }
  });
}

/* ---------- Boot ---------- */
applyCollapsed();
loadPerson('priya');
try{ window.matchMedia('(min-width:920px)').addEventListener('change', ()=>renderRail()); }catch(e){}
(async()=>{
  try{ state.ai = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }catch(e){ state.ai=null; }
  if(state.ai) logEvent('Live AI connected', ['Drishti, rehearsal and reflections answer live']);
  renderRail(); const top=state.stack[state.stack.length-1]; if(top.v==='companion') render();
})();
</script>
